  #    restart: unless-stopped
    
  # METABASE
  #  metabase:
  #    image: metabase/metabase
  #    container_name: metabase
  #    ports:
  #      - "3000:3000"
  #    depends_on:
  #      - spark-master
  #      - minio
  #      - hive-metastore
  #      - trino
  #    restart: always
  #    env_file:
  #      - .env

  # NOTEBOOK
  notebook:
    build:
      context: .
      dockerfile: docker/notebook/Dockerfile
    env_file:
      - .env
    ports:
      - "8888:8888"
    environment:
      PYTHONPATH: /projeto
    volumes:
      - .:/projeto
    depends_on:
      - spark-master
      - minio

volumes:
#  postgres-db-volume:
  minio-data:
  hive-metastore-db:
