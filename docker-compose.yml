services:
  # MINIO (DATA LAKE)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do
        sleep 2;
      done;
      mc mb -p local/datalake;
      mc mb -p local/datalake/warehouse;
      mc mb -p local/datalake/bronze;
      mc mb -p local/datalake/silver;
      mc mb -p local/datalake/gold;
      echo 'Buckets created successfully';
      exit 0;
      "
  # POSTGRES METASTORE
  postgres-metastore:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${METASTORE_USER_KEY}
      POSTGRES_PASSWORD: ${METASTORE_SECRET_KEY}
      POSTGRES_DB: ${METASTORE_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_USER_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # HIVE METASTORE
  hive-metastore:
    build: ./docker/hive/
    container_name: hive-metastore
    env_file:
      - .env
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/${METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${METASTORE_USER_KEY}
        -Djavax.jdo.option.ConnectionPassword=${METASTORE_SECRET_KEY}
      HADOOP_CLIENT_OPTS: >
        -Xmx1g
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.endpoint.region=us-east-1
        -Dfs.s3a.access.key=${MINIO_ACCESS_KEY}
        -Dfs.s3a.secret.key=${MINIO_SECRET_KEY}
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        -Dcom.amazonaws.services.s3.enableV4=true
    command: >
      bash -c "/opt/hive/bin/hive --service metastore"
    ports:
      - "9083:9083"
    depends_on:
      postgres-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - ./docker/hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml

  # TRINO
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8085:8080"
    env_file:
      - .env
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
    depends_on:
      hive-metastore:
        condition: service_healthy
    restart: always

  # SPARK MASTER
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    env_file:
      - .env
    container_name: spark-master
    command: >
      bash -c "
      $$SPARK_HOME/sbin/start-master.sh &&
      sleep infinity
      "
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - .:/projeto
    depends_on:
      minio:
        condition: service_healthy
    restart: always

  # SPARK WORKER
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    env_file:
      - .env
    container_name: spark-worker
    command: >
      bash -c "
      $$SPARK_HOME/sbin/start-worker.sh spark://spark-master:7077 &&
      sleep infinity
      "
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - .:/projeto
    depends_on:
      - spark-master
    restart: always
    
  # DBT
  #  dbt:
  #    build:
  #      context: .
  #      dockerfile: docker/dbt/Dockerfile
  #    volumes:
  #      - ./dbt_project:/usr/app
  #    working_dir: /usr/app
  #    depends_on:
  #      - trino
  #    tty: true
  #    env_file:
